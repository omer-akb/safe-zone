{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "thyris-sz.secretName" . }}
  labels:
    {{- include "thyris-sz.labels" . | nindent 4 }}
type: Opaque
stringData:
  AI_API_KEY: {{ .Values.secrets.aiApiKey | quote }}
  ADMIN_API_KEY: {{ .Values.secrets.adminApiKey | quote }}
  DB_DSN: {{ include "thyris-sz.dbDsn" . | quote }}
  REDIS_URL: {{ include "thyris-sz.redisUrl" . | quote }}
{{- end }}
